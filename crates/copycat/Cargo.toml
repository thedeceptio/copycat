[package]
name = "copycat"
description = "copycat clipboard manager (GTK4/libadwaita app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "copycat"
path = "src/main.rs"

[dependencies]
copycat-core = { workspace = true }
# Matches the ship target (Ubuntu 24.04: GTK 4.14 / libadwaita 1.5); see SPEC §5.1.
gtk = { package = "gtk4", version = "0.8" }
adw = { package = "libadwaita", version = "0.6", features = ["v1_5"] }
