[package]
name = "copycat"
description = "copycat clipboard manager (GTK4/libadwaita app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "copycat"
path = "src/main.rs"

[dependencies]
copycat-core = { workspace = true }
# Bindings pinned to the host GTK (4.6) / libadwaita (1.1); see SPEC §5.1.
# libadwaita is added back once the plain-GTK toolchain is validated.
gtk = { package = "gtk4", version = "0.5" }
